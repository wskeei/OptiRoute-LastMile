  <rect class="label-bg" x="210" y="936" width="116" height="22" rx="10" ry="10"/>

  <text class="msg-text" x="270" y="149">发起调度</text>
  <text class="msg-text" x="710" y="203">创建 plan</text>
  <text class="msg-text" x="270" y="257">返回 plan_id</text>
  <text class="msg-text" x="490" y="311">启动后台任务</text>
  <text class="msg-text" x="820" y="393">读取待调度数据</text>
  <text class="msg-text" x="820" y="455">资源不足则结束</text>
  <text class="msg-text" x="710" y="529">执行聚类</text>
  <text class="msg-text" x="820" y="591">预建路线</text>
  <text class="msg-text" x="710" y="669">执行路径优化</text>
  <text class="msg-text" x="820" y="731">写中间进度</text>
  <text class="msg-text" x="270" y="779">轮询状态</text>
  <text class="msg-text" x="710" y="835">查询 plan/routes</text>
  <text class="msg-text" x="820" y="891">写最终结果</text>
  <text class="msg-text" x="268" y="947">返回状态与路线</text>

  <rect class="note" x="160" y="986" width="76" height="34" rx="10" ry="10"/>
  <text class="msg-text" x="198" y="1004" fill="#8c4e24">停止轮询</text>

  <rect class="legend" x="1230" y="132" width="290" height="248" rx="16" ry="16"/>
  <rect class="legend" x="1230" y="396" width="290" height="146" rx="16" ry="16"/>

  <text class="legend-title" x="1248" y="158">真实对应说明</text>
  <text class="legend-text" x="1248" y="188">• 发起调度 = POST /dispatch/plans</text>
  <text class="legend-text" x="1248" y="210">• 轮询状态 = GET /dispatch/plans/{id}</text>
  <text class="legend-text" x="1248" y="232">• 写中间进度 = 更新 route.geo_json</text>
  <text class="legend-text" x="1248" y="254">• 写最终结果 = 更新 route / package / plan</text>

  <text class="legend-title" x="1248" y="422">状态</text>
  <text class="legend-text" x="1248" y="452">• plan: OPTIMIZING -&gt; READY / COMPLETED</text>
  <text class="legend-text" x="1248" y="474">• route: calculating -&gt; optimizing -&gt; optimized</text>

</svg>
