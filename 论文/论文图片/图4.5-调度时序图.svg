  <line class="msg" x1="600" y1="742" x2="1040" y2="742" marker-end="url(#arrow-solid)"/>
  <line class="msg" x1="160" y1="790" x2="380" y2="790" marker-end="url(#arrow-solid)"/>
  <line class="msg" x1="380" y1="846" x2="1040" y2="846" marker-end="url(#arrow-solid)"/>
  <line class="msg" x1="600" y1="902" x2="1040" y2="902" marker-end="url(#arrow-solid)"/>
  <line class="msg-dashed" x1="380" y1="958" x2="160" y2="958" marker-end="url(#arrow-open)"/>

