<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1080" viewBox="0 0 1560 1080" role="img" aria-labelledby="title desc">
  <title id="title">图4.5 调度时序图</title>
  <desc id="desc">基于真实代码抽象后的调度时序图，包含创建计划、后台准备、路径求解、前端轮询和完成收尾五个阶段。</desc>

  <defs>
    <marker id="arrow-solid" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c778d"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7a8da0" stroke-width="1.4"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; stroke: none; }
      .head { fill: #f3f6f8; stroke: #90a2b1; stroke-width: 1.5; }
      .life { stroke: #a5b3be; stroke-width: 1.5; stroke-dasharray: 6 8; }
      .activation { fill: rgba(76,120,168,0.12); stroke: rgba(76,120,168,0.35); stroke-width: 1; }
      .msg { fill: none; stroke: #5c778d; stroke-width: 2; }
      .msg-dashed { fill: none; stroke: #7a8da0; stroke-width: 2; stroke-dasharray: 8 7; }
      .chip { fill: #f3f6f8; stroke: #8c9cab; stroke-width: 1; }
      .fragment-loop { fill: rgba(255,255,255,0.42); stroke: #7a8da6; stroke-width: 1.5; }
      .fragment-alt { fill: rgba(248,249,251,0.8); stroke: #7a8da6; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .label-bg { fill: rgba(255,255,255,0.97); stroke: none; }
      .note { fill: rgba(255,248,241,0.96); stroke: #c96a28; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .legend { fill: rgba(255,255,255,0.95); stroke: #c9d1d9; stroke-width: 1.1; }
      .title {
        font-family: SimSun, Songti SC, STSong, serif;
        font-size: 13px;
        font-weight: 700;
        fill: #233645;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .chip-text {
        font-family: SimSun, Songti SC, STSong, serif;
        font-size: 12px;
        font-weight: 700;
        fill: #516577;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .fragment-text {
        font-family: 'Times New Roman', serif;
        font-size: 12px;
        fill: #4b657b;
      }
      .msg-text {
        font-family: SimSun, Songti SC, STSong, serif;
        font-size: 12px;
        fill: #38546b;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .legend-title {
        font-family: SimSun, Songti SC, STSong, serif;
        font-size: 14px;
        font-weight: 700;
        fill: #35516a;
      }
      .legend-text {
        font-family: SimSun, Songti SC, STSong, serif;
        font-size: 11px;
        fill: #486073;
      }
      .caption {
        font-family: SimSun, Songti SC, STSong, serif;
        font-size: 20px;
        fill: #1e2f3c;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1560" height="1080"/>

  <rect class="head" x="72" y="52" width="176" height="40" rx="12" ry="12"/>
