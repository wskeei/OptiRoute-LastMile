  <text class="chip-text" x="74" y="388">后台准备</text>
  <text class="chip-text" x="74" y="514">路径求解</text>
  <text class="chip-text" x="74" y="766">前端轮询</text>
  <text class="chip-text" x="74" y="920">完成收尾</text>

